plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.coef'
version = '0.1.0'

android {
  namespace "app.coef.notifications"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'androidx.core:core:1.17.0'
  // Même version que celle d'expo-background-task (bouton « Tester » de Réglages).
  implementation 'androidx.work:work-runtime:2.10.5'
}
