# APK signé publié en release GitHub à chaque tag vX.Y.Z (Obtainium suit ces releases).
# Lancé à la main (Actions > release > Run workflow) : avec une version (ex. 0.2.0), crée le tag et la release ;
# sans version, construit seulement les APK et les garde en artefact.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (X.Y.Z), vide = APK d’essai sans release'
        required: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test -- --ci

      # Version : celle du tag ou celle donnée à la main (1.2.3 → versionCode 10203) ; sinon celle d'app.json + numéro d'essai.
      - name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] || [ -n "$VERSION" ]; then
            V="${VERSION:-${GITHUB_REF_NAME#v}}"
            [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version attendue : X.Y.Z (reçu $V)"; exit 1; }
            echo "TAG=v$V" >> "$GITHUB_ENV"
          else
            V="$(node -p "require('./app.json').expo.version")"
          fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA * 10000 + MI * 100 + PA))
          node -e "
            const fs = require('fs'); const a = JSON.parse(fs.readFileSync('app.json'));
            a.expo.version = '$V'; a.expo.android.versionCode = $CODE;
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2));"
          [ "$GITHUB_REF_TYPE" = tag ] || [ -n "$VERSION" ] || V="$V-essai.$GITHUB_RUN_NUMBER"
          echo "V=$V" >> "$GITHUB_ENV"

      - run: npx expo prebuild -p android --no-install
        env:
          NODE_ENV: production
      # Un APK par architecture (splits ABI, plugins/allegement.js) : arm64 (téléphones récents), armv7 (anciens
      # téléphones 32 bits), x86_64 (Chromebooks, émulateurs). Pas d'APK universel : il cumulerait les trois.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon
        working-directory: android
        env:
          NODE_ENV: production

      # Gradle signe avec la clé de debug du modèle Expo : on re-signe avec la clé de Coef (secrets du dépôt).
      - name: Signature
        env:
          COEF_KEYSTORE: ${{ secrets.COEF_KEYSTORE }}
          COEF_KEYSTORE_PASS: ${{ secrets.COEF_KEYSTORE_PASS }}
        run: |
          SORTIE=android/app/build/outputs/apk/release
          # Pas de clé : release « dev », signée avec la clé de debug du modèle Expo.
          if [ -z "$COEF_KEYSTORE" ]; then
            echo "::warning::Secret COEF_KEYSTORE absent : APK dev, signé avec la clé de debug."
            echo "DEV=1" >> "$GITHUB_ENV"
            for a in arm64-v8a armeabi-v7a x86_64; do cp "$SORTIE/app-$a-release.apk" "coef-$V-$a.apk"; done; exit 0
          fi
          echo "$COEF_KEYSTORE" | base64 -d > "$RUNNER_TEMP/coef.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for a in arm64-v8a armeabi-v7a x86_64; do
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/coef.jks" --ks-pass env:COEF_KEYSTORE_PASS --ks-key-alias coef --out "coef-$V-$a.apk" "$SORTIE/app-$a-release.apk"
            "$BT/apksigner" verify "coef-$V-$a.apk"
          done
          rm "$RUNNER_TEMP/coef.jks"
          ls -la coef-*.apk

      # Tag poussé, ou version donnée à la main (le tag est alors créé sur le commit lancé).
      - if: env.TAG != ''
        run: |
          if [ -n "$DEV" ]; then
            gh release create "$TAG" coef-*.apk --target "$GITHUB_SHA" --title "Coef $V (dev)" --prerelease --generate-notes \
              --notes "Version de développement, signée avec une clé de debug : à réinstaller quand les versions signées arriveront."
          else
            gh release create "$TAG" coef-*.apk --target "$GITHUB_SHA" --title "Coef $V" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: coef-${{ env.V }}
          path: coef-${{ env.V }}-*.apk
