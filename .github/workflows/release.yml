# APK signé publié en release GitHub à chaque tag vX.Y.Z (Obtainium suit ces releases).
# Lancé à la main (workflow_dispatch) : construit l'APK et le garde en artefact, sans release.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test -- --ci

      # Version : celle du tag (v1.2.3 → 1.2.3, versionCode 10203) ; à la main : celle d'app.json + numéro d'essai.
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            V="${GITHUB_REF_NAME#v}"
            [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag attendu : vX.Y.Z (reçu $GITHUB_REF_NAME)"; exit 1; }
          else
            V="$(node -p "require('./app.json').expo.version")"
          fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA * 10000 + MI * 100 + PA))
          node -e "
            const fs = require('fs'); const a = JSON.parse(fs.readFileSync('app.json'));
            a.expo.version = '$V'; a.expo.android.versionCode = $CODE;
            fs.writeFileSync('app.json', JSON.stringify(a, null, 2));"
          [ "$GITHUB_REF_TYPE" = tag ] || V="$V-essai.$GITHUB_RUN_NUMBER"
          echo "V=$V" >> "$GITHUB_ENV"

      - run: npx expo prebuild -p android --no-install
        env:
          NODE_ENV: production
      # arm64 seulement : tous les téléphones Android récents ; moitié moins de code natif à compiler et à télécharger.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: android
        env:
          NODE_ENV: production

      # Gradle signe avec la clé de debug du modèle Expo : on re-signe avec la clé de Coef (secrets du dépôt).
      - name: Signature
        env:
          COEF_KEYSTORE: ${{ secrets.COEF_KEYSTORE }}
          COEF_KEYSTORE_PASS: ${{ secrets.COEF_KEYSTORE_PASS }}
        run: |
          # Pas encore de clé : release « dev », signée avec la clé de debug du modèle Expo (la même à chaque build,
          # donc les mises à jour dev s'enchaînent ; passer à la vraie clé demandera une réinstallation).
          if [ -z "$COEF_KEYSTORE" ]; then
            echo "::warning::Secret COEF_KEYSTORE absent : APK dev, signé avec la clé de debug."
            echo "DEV=1" >> "$GITHUB_ENV"
            cp android/app/build/outputs/apk/release/app-release.apk "coef-$V.apk"; exit 0
          fi
          echo "$COEF_KEYSTORE" | base64 -d > "$RUNNER_TEMP/coef.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/coef.jks" --ks-pass env:COEF_KEYSTORE_PASS --ks-key-alias coef \
            --out "coef-$V.apk" android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "coef-$V.apk"
          rm "$RUNNER_TEMP/coef.jks"

      - if: github.ref_type == 'tag'
        run: |
          if [ -n "$DEV" ]; then
            gh release create "$GITHUB_REF_NAME" "coef-$V.apk" --title "Coef $V (dev)" --prerelease --generate-notes \
              --notes "Version de développement, signée avec une clé de debug : à réinstaller quand les versions signées arriveront."
          else
            gh release create "$GITHUB_REF_NAME" "coef-$V.apk" --title "Coef $V" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: coef-${{ env.V }}
          path: coef-${{ env.V }}.apk
